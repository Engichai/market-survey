<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Survey Collector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-24">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg">Market Survey Collector</h1>
                <p id="conn-status" class="text-xs text-amber-200">● กำลังโหลดระบบ...</p>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="exportCSV()" class="bg-blue-700 hover:bg-blue-800 text-xs px-2.5 py-1.5 rounded font-medium transition">Export CSV</button>
                <button type="button" onclick="openSettings()" class="bg-blue-700 hover:bg-blue-800 p-2 rounded-full transition cursor-pointer">⚙️</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Filter Bar -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex gap-2">
            <input type="text" id="search-box" placeholder="🔍 ค้นหาแบรนด์, สินค้า, สถานที่..." class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="renderItems()">
        </div>

        <!-- Survey List -->
        <div id="survey-list" class="space-y-3">
            <div class="text-center py-10 text-slate-400 bg-white rounded-xl border border-slate-200">กำลังโหลดข้อมูล...</div>
        </div>

    </main>

    <!-- Floating Action Button -->
    <div class="fixed bottom-6 right-6 z-40">
        <button type="button" onclick="openForm()" class="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl transition transform active:scale-95">+</button>
    </div>

    <!-- Modal Form -->
    <div id="survey-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 id="modal-title" class="font-bold text-lg text-slate-800">บันทึกข้อมูลสินค้าสำรวจ</h2>
                <button type="button" onclick="closeForm()" class="text-slate-400 hover:text-slate-600 font-bold text-xl p-1">✕</button>
            </div>

            <form id="survey-form" onsubmit="saveItem(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">สถานที่สำรวจ (Store / Location) *</label>
                    <input type="text" id="storeName" required placeholder="เช่น Lotus Pluit, Supermarket A" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">แบรนด์สินค้า *</label>
                        <input type="text" id="brand" required placeholder="ชื่อแบรนด์" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">ประเภท / รสชาติ</label>
                        <input type="text" id="category" placeholder="เช่น ช็อกโกแลต, สูตรดั้งเดิม" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">ราคาปกติ</label>
                        <input type="number" id="regularPrice" step="any" placeholder="0.00" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="calculateUnit()">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">ราคาโปรโมชั่น</label>
                        <input type="number" id="promoPrice" step="any" placeholder="0.00" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="calculateUnit()">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">ขนาดบรรจุ</label>
                        <input type="number" id="packageSize" step="any" placeholder="เช่น 150 หรือ 12" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="calculateUnit()">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">หน่วย</label>
                        <select id="packageUnit" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" onchange="calculateUnit()">
                            <option value="กรัม">กรัม (g)</option>
                            <option value="มิลลิลิตร">มิลลิลิตร (ml)</option>
                            <option value="ชิ้น">ชิ้น (pcs)</option>
                            <option value="แพ็ค">แพ็ค</option>
                        </select>
                    </div>
                </div>

                <div class="bg-blue-50 p-2.5 rounded-lg text-xs text-blue-800 flex justify-between">
                    <span id="calc-discount">ส่วนลด: 0%</span>
                    <span id="calc-unitprice" class="font-bold">ราคาเฉลี่ย: -</span>
                </div>

                <div>
                    <label class="block font-medium text-slate-700 mb-1">รูปถ่ายสินค้า / ป้ายราคา</label>
                    <input type="file" id="itemPhoto" accept="image/*" capture="environment" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" onchange="previewImage(event)">
                    <div id="photo-preview-container" class="mt-2 hidden">
                        <img id="photo-preview" alt="พรีวิวรูป" class="w-full h-32 object-cover rounded-lg border">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">บันทึกข้อมูลเข้า Cloud</button>
            </form>
        </div>
    </div>

    <!-- Modal Settings -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="font-bold text-lg text-slate-800">ตั้งค่า Firebase Cloud</h2>
                <button type="button" onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 font-bold text-xl p-1">✕</button>
            </div>
            <p class="text-xs text-slate-500">นำข้อมูล Firebase Config มาใส่ที่นี่เพื่อเชื่อมต่อฐานข้อมูลกลางร่วมกับทีมงาน</p>
            <div class="space-y-2 text-xs">
                <div>
                    <label class="font-medium">API Key</label>
                    <input type="text" id="cfg-apiKey" class="w-full border rounded p-1.5 mt-0.5 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="font-medium">Auth Domain</label>
                    <input type="text" id="cfg-authDomain" class="w-full border rounded p-1.5 mt-0.5 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="font-medium">Project ID</label>
                    <input type="text" id="cfg-projectId" class="w-full border rounded p-1.5 mt-0.5 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="font-medium">App ID</label>
                    <input type="text" id="cfg-appId" class="w-full border rounded p-1.5 mt-0.5 outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="saveSettings()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">บันทึก & เชื่อมต่อ</button>
                <button type="button" onclick="closeSettings()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 rounded-lg text-sm transition">ปิด</button>
            </div>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let db = null;
        let unsubscribe = null;
        window.surveyItems = [];
        window.currentPhotoBase64 = "";

        // UI Functions assigned to window
        window.openSettings = function() {
            const config = JSON.parse(localStorage.getItem('fb_config') || '{}');
            document.getElementById('cfg-apiKey').value = config.apiKey || 'AIzaSyDBH18QRTobEg-G4iIVJPAMpcBVhkKeidY';
            document.getElementById('cfg-authDomain').value = config.authDomain || 'market-survey-app-ad41c.firebaseapp.com';
            document.getElementById('cfg-projectId').value = config.projectId || 'market-survey-app-ad41c';
            document.getElementById('cfg-appId').value = config.appId || '1:313606973590:web:6dd2d6682a01799d30fab7';
            document.getElementById('settings-modal').classList.remove('hidden');
        };

        window.closeSettings = function() {
            document.getElementById('settings-modal').classList.add('hidden');
        };

        window.saveSettings = function() {
            const config = {
                apiKey: document.getElementById('cfg-apiKey').value.trim(),
                authDomain: document.getElementById('cfg-authDomain').value.trim(),
                projectId: document.getElementById('cfg-projectId').value.trim(),
                storageBucket: document.getElementById('cfg-projectId').value.trim() + ".appspot.com",
                appId: document.getElementById('cfg-appId').value.trim()
            };
            localStorage.setItem('fb_config', JSON.stringify(config));
            window.closeSettings();
            location.reload();
        };

        window.openForm = function() {
            document.getElementById('survey-modal').classList.remove('hidden');
            document.getElementById('survey-form').reset();
            document.getElementById('photo-preview-container').classList.add('hidden');
            window.currentPhotoBase64 = "";
        };

        window.closeForm = function() {
            document.getElementById('survey-modal').classList.add('hidden');
        };

        window.calculateUnit = function() {
            const reg = parseFloat(document.getElementById('regularPrice').value) || 0;
            const promo = parseFloat(document.getElementById('promoPrice').value) || 0;
            const size = parseFloat(document.getElementById('packageSize').value) || 0;
            const unit = document.getElementById('packageUnit').value;

            let finalPrice = promo > 0 ? promo : reg;
            let discount = (reg > 0 && promo > 0 && promo < reg) ? Math.round(((reg - promo) / reg) * 100) : 0;

            document.getElementById('calc-discount').innerText = `ส่วนลด: ${discount}%`;

            if (finalPrice > 0 && size > 0) {
                let unitPrice = finalPrice / size;
                document.getElementById('calc-unitprice').innerText = `ราคาเฉลี่ย: ${unitPrice.toFixed(2)} / ${unit}`;
            } else {
                document.getElementById('calc-unitprice').innerText = `ราคาเฉลี่ย: -`;
            }
        };

        window.previewImage = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 600;
                        const MAX_HEIGHT = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        window.currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);

                        document.getElementById('photo-preview').src = window.currentPhotoBase64;
                        document.getElementById('photo-preview-container').classList.remove('hidden');
                    }
                }
                reader.readAsDataURL(file);
            }
        };

        window.renderItems = function() {
            const keyword = document.getElementById('search-box').value.toLowerCase();
            const listEl = document.getElementById('survey-list');
            const items = window.surveyItems || [];

            const filtered = items.filter(i => 
                (i.storeName && i.storeName.toLowerCase().includes(keyword)) ||
                (i.brand && i.brand.toLowerCase().includes(keyword)) ||
                (i.category && i.category.toLowerCase().includes(keyword))
            );

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-400 bg-white rounded-xl border border-slate-200">ยังไม่มีข้อมูลสำรวจ หรือไม่พบข้อมูลที่ค้นหา</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => {
                const priceToShow = item.promoPrice ? item.promoPrice : item.regularPrice;
                return `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex gap-3 items-center">
                        <div class="w-20 h-20 bg-slate-100 rounded-lg flex-shrink-0 overflow-hidden border">
                            ${item.photo ? `<img src="${item.photo}" class="w-full h-full object-cover">` : `<div class="flex items-center justify-center h-full text-xs text-slate-400">ไม่มีรูป</div>`}
                        </div>
                        <div class="flex-grow min-w-0">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-slate-800 truncate">${item.brand}</h3>
                                <button type="button" onclick="deleteItemFromCloud('${item.id}')" class="text-slate-300 hover:text-red-500 text-xs px-1">🗑️</button>
                            </div>
                            <p class="text-xs text-slate-500 truncate">📍 ${item.storeName} | ${item.category || '-'}</p>
                            <div class="mt-1 flex items-baseline gap-2">
                                <span class="font-bold text-blue-600 text-sm">${priceToShow}</span>
                                ${item.promoPrice && item.regularPrice ? `<span class="text-xs text-slate-400 line-through">${item.regularPrice}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.exportCSV = function() {
            const items = window.surveyItems || [];
            if (items.length === 0) {
                alert("ยังไม่มีข้อมูลสำหรับ Export");
                return;
            }
            let csvContent = "\uFEFFสถานที่,แบรนด์,ประเภท,ราคาปกติ,ราคาโปรโมชั่น,ขนาดบรรจุ,หน่วย,วันที่\n";
            items.forEach(i => {
                csvContent += `"${i.storeName}","${i.brand}","${i.category || ''}","${i.regularPrice || ''}","${i.promoPrice || ''}","${i.packageSize || ''}","${i.packageUnit || ''}","${i.timestamp}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `market-survey-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        };

        // Firebase Initialization & Actions
        function initFirebase() {
            const config = JSON.parse(localStorage.getItem('fb_config') || '{}');
            if (config.apiKey && config.projectId) {
                try {
                    const app = initializeApp(config);
                    db = getFirestore(app);
                    document.getElementById('conn-status').innerText = "● Cloud Connected (พร้อมใช้งาน)";
                    document.getElementById('conn-status').className = "text-xs text-emerald-200";
                    loadCloudData();
                } catch (e) {
                    document.getElementById('conn-status').innerText = "● Connection Failed";
                    document.getElementById('conn-status').className = "text-xs text-red-200";
                }
            } else {
                document.getElementById('conn-status').innerText = "● ยังไม่ได้ตั้งค่า Firebase (คลิก ⚙️)";
                document.getElementById('conn-status').className = "text-xs text-amber-200";
            }
        }

        function loadCloudData() {
            if (!db) return;
            if (unsubscribe) unsubscribe();
            
            const q = collection(db, "surveys");
            unsubscribe = onSnapshot(q, (snapshot) => {
                window.surveyItems = [];
                snapshot.forEach((docSnap) => {
                    window.surveyItems.push({ id: docSnap.id, ...docSnap.data() });
                });
                window.renderItems();
            }, (error) => {
                document.getElementById('conn-status').innerText = "● Sync Error";
            });
        }

        window.saveItem = async function(event) {
            event.preventDefault();
            if (!db) {
                alert("กรุณาตั้งค่า Firebase Config ที่ไอคอนเฟือง (⚙️) ก่อนครับ");
                window.openSettings();
                return;
            }
            const item = {
                storeName: document.getElementById('storeName').value,
                brand: document.getElementById('brand').value,
                category: document.getElementById('category').value,
                regularPrice: document.getElementById('regularPrice').value,
                promoPrice: document.getElementById('promoPrice').value,
                packageSize: document.getElementById('packageSize').value,
                packageUnit: document.getElementById('packageUnit').value,
                photo: window.currentPhotoBase64 || '',
                timestamp: new Date().toISOString()
            };
            try {
                await addDoc(collection(db, "surveys"), item);
                window.closeForm();
                document.getElementById('survey-form').reset();
                document.getElementById('photo-preview-container').classList.add('hidden');
                window.currentPhotoBase64 = "";
            } catch (e) {
                alert("เกิดข้อผิดพลาดในการบันทึก: " + e.message);
            }
        };

        window.deleteItemFromCloud = async function(id) {
            if (!db || !confirm("ต้องการลบรายการนี้ใช่หรือไม่?")) return;
            try {
                await deleteDoc(doc(db, "surveys", id));
            } catch (e) {
                alert("ไม่สามารถลบได้: " + e.message);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initFirebase();
        });
    </script>
</body>
</html>
