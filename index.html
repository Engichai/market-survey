<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Survey Collector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-24">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 id="ui-title" class="font-bold text-lg">Market Survey Collector</h1>
                <p id="conn-status" class="text-xs text-amber-200">● กำลังโหลดระบบ...</p>
            </div>
            <div class="flex items-center gap-2">
                <!-- Language Switcher -->
                <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-blue-700 text-white text-xs px-2 py-1.5 rounded outline-none cursor-pointer">
                    <option value="th">🇹🇭 TH</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="id">🇮🇩 ID</option>
                </select>
                <button type="button" onclick="exportCSV()" id="btn-export" class="bg-blue-700 hover:bg-blue-800 text-xs px-2.5 py-1.5 rounded font-medium transition">Export</button>
                <button type="button" onclick="openSettings()" class="bg-blue-700 hover:bg-blue-800 p-2 rounded-full transition cursor-pointer">⚙️</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Filter Bar -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex gap-2">
            <input type="text" id="search-box" placeholder="🔍 ค้นหาแบรนด์, สินค้า, สถานที่..." class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="renderItems()">
        </div>

        <!-- Survey List -->
        <div id="survey-list" class="space-y-3">
            <div id="ui-loading" class="text-center py-10 text-slate-400 bg-white rounded-xl border border-slate-200">กำลังโหลดข้อมูล...</div>
        </div>

    </main>

    <!-- Floating Action Button -->
    <div class="fixed bottom-6 right-6 z-40">
        <button type="button" onclick="openForm()" class="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl transition transform active:scale-95">+</button>
    </div>

    <!-- Modal Form (Add / Edit) -->
    <div id="survey-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 id="form-modal-title" class="font-bold text-lg text-slate-800">บันทึกข้อมูลสินค้าสำรวจ</h2>
                <button type="button" onclick="closeForm()" class="text-slate-400 hover:text-slate-600 font-bold text-xl p-1">✕</button>
            </div>

            <form id="survey-form" onsubmit="saveItem(event)" class="space-y-3 text-sm">
                <div>
                    <label id="lbl-store" class="block font-medium text-slate-700 mb-1">สถานที่สำรวจ (Store / Location) *</label>
                    <input type="text" id="storeName" required placeholder="เช่น Lotus Pluit, Supermarket A" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label id="lbl-brand" class="block font-medium text-slate-700 mb-1">แบรนด์สินค้า *</label>
                        <input type="text" id="brand" required placeholder="ชื่อแบรนด์" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label id="lbl-category" class="block font-medium text-slate-700 mb-1">หมวดหมู่สินค้า</label>
                        <select id="categorySelect" class="w-full border border-slate-300 rounded-lg px-2 py-2 outline-none focus:border-blue-500 mb-1" onchange="handleCategoryChange()">
                            <option value="อาหาร">🍽️ อาหาร (Food)</option>
                            <option value="เครื่องดื่ม">🥤 เครื่องดื่ม (Beverage)</option>
                            <option value="อุปกรณ์ไฟฟ้า">⚡ อุปกรณ์ไฟฟ้า (Electronics)</option>
                            <option value="ห้องครัว">🍳 ห้องครัว (Kitchen)</option>
                            <option value="custom">-- ✍️ ระบุเอง (Other) --</option>
                        </select>
                        <input type="text" id="categoryCustom" placeholder="พิมพ์หมวดหมู่เอง..." class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500 hidden">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label id="lbl-regprice" class="block font-medium text-slate-700 mb-1">ราคาปกติ (Rp)</label>
                        <input type="text" id="regularPriceInput" placeholder="50,000" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="formatPriceInput(this); calculateUnit();">
                    </div>
                    <div>
                        <label id="lbl-promoprice" class="block font-medium text-slate-700 mb-1">ราคาโปรโมชั่น (Rp)</label>
                        <input type="text" id="promoPriceInput" placeholder="45,000" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="formatPriceInput(this); calculateUnit();">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label id="lbl-pkgsize" class="block font-medium text-slate-700 mb-1">ขนาดบรรจุ</label>
                        <input type="number" id="packageSize" step="any" placeholder="เช่น 150 หรือ 12" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="calculateUnit()">
                    </div>
                    <div>
                        <label id="lbl-pkgunit" class="block font-medium text-slate-700 mb-1">หน่วย</label>
                        <select id="packageUnitSelect" class="w-full border border-slate-300 rounded-lg px-2 py-2 outline-none focus:border-blue-500 mb-1" onchange="handleUnitChange()">
                            <option value="กรัม">กรัม (g)</option>
                            <option value="มิลลิลิตร">มิลลิลิตร (ml)</option>
                            <option value="ชิ้น">ชิ้น (pcs)</option>
                            <option value="แพ็ค">แพ็ค</option>
                            <option value="custom">-- พิมพ์ระบุเอง --</option>
                        </select>
                        <input type="text" id="packageUnitCustom" placeholder="พิมพ์หน่วยเอง..." class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500 hidden" oninput="calculateUnit()">
                    </div>
                </div>

                <div class="bg-blue-50 p-2.5 rounded-lg text-xs text-blue-800 flex justify-between">
                    <span id="calc-discount">ส่วนลด: 0%</span>
                    <span id="calc-unitprice" class="font-bold">ราคาเฉลี่ย: -</span>
                </div>

                <div>
                    <label id="lbl-photos" class="block font-medium text-slate-700 mb-1">รูปถ่ายสินค้า / ป้ายราคา (สูงสุด 5 รูป)</label>
                    <input type="file" id="itemPhoto" accept="image/*" multiple class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" onchange="previewImages(event)">
                    <div id="photo-preview-grid" class="mt-2 grid grid-cols-5 gap-2 hidden"></div>
                </div>

                <button type="submit" id="btn-save" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">บันทึกข้อมูลเข้า Cloud</button>
            </form>
        </div>
    </div>

    <!-- Modal Detail (View Full Info) -->
    <div id="detail-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 id="detail-modal-title" class="font-bold text-lg text-slate-800">รายละเอียดข้อมูลสำรวจ</h2>
                <button type="button" onclick="closeDetail()" class="text-slate-400 hover:text-slate-600 font-bold text-xl p-1">✕</button>
            </div>
            <div id="detail-content" class="space-y-3 text-sm"></div>
            <button type="button" onclick="closeDetail()" id="btn-close" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 rounded-lg text-sm transition">ปิด</button>
        </div>
    </div>

    <!-- Modal Settings -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="font-bold text-lg text-slate-800">ตั้งค่า Firebase Cloud</h2>
                <button type="button" onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 font-bold text-xl p-1">✕</button>
            </div>
            <p class="text-xs text-slate-500">นำข้อมูล Firebase Config มาใส่ที่นี่เพื่อเชื่อมต่อฐานข้อมูลกลางร่วมกับทีมงาน</p>
            <div class="space-y-2 text-xs">
                <div>
                    <label class="font-medium">API Key</label>
                    <input type="text" id="cfg-apiKey" class="w-full border rounded p-1.5 mt-0.5 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="font-medium">Auth Domain</label>
                    <input type="text" id="cfg-authDomain" class="w-full border rounded p-1.5 mt-0.5 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="font-medium">Project ID</label>
                    <input type="text" id="cfg-projectId" class="w-full border rounded p-1.5 mt-0.5 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="font-medium">App ID</label>
                    <input type="text" id="cfg-appId" class="w-full border rounded p-1.5 mt-0.5 outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="saveSettings()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">บันทึก & เชื่อมต่อ</button>
                <button type="button" onclick="closeSettings()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 rounded-lg text-sm transition">ปิด</button>
            </div>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let db = null;
        let unsubscribe = null;
        window.surveyItems = [];
        window.currentPhotos = [];
        window.currentLang = localStorage.getItem('app_lang') || 'th';

        const i18n = {
            th: {
                title: "Market Survey Collector",
                searchPlaceholder: "🔍 ค้นหาแบรนด์, สินค้า, สถานที่, หมวดหมู่...",
                export: "Export CSV",
                noData: "ยังไม่มีข้อมูลสำรวจ หรือไม่พบข้อมูลที่ค้นหา",
                loading: "กำลังโหลดข้อมูล...",
                connReady: "● Cloud Connected (พร้อมใช้งาน)",
                connWait: "● กำลังโหลดระบบ...",
                formTitle: "บันทึกข้อมูลสินค้าสำรวจ",
                store: "สถานที่สำรวจ (Store / Location) *",
                brand: "แบรนด์สินค้า *",
                category: "หมวดหมู่สินค้า",
                regPrice: "ราคาปกติ (Rp)",
                promoPrice: "ราคาโปรโมชั่น (Rp)",
                pkgSize: "ขนาดบรรจุ",
                pkgUnit: "หน่วย",
                photos: "รูปถ่ายสินค้า / ป้ายราคา (สูงสุด 5 รูป)",
                saveBtn: "บันทึกข้อมูลเข้า Cloud",
                detailTitle: "รายละเอียดข้อมูลสำรวจ",
                closeBtn: "ปิด",
                tapDetail: "แตะดูรายละเอียด",
                noPhoto: "ไม่มีรูป",
                deleteConfirm: "ต้องการลบรายการนี้ใช่หรือไม่?",
                viewPhotos: "รูปภาพสินค้า"
            },
            en: {
                title: "Market Survey Collector",
                searchPlaceholder: "🔍 Search brand, product, location, category...",
                export: "Export CSV",
                noData: "No survey data found.",
                loading: "Loading data...",
                connReady: "● Cloud Connected (Ready)",
                connWait: "● Loading system...",
                formTitle: "New Survey Item",
                store: "Store / Location *",
                brand: "Brand Name *",
                category: "Category",
                regPrice: "Regular Price (Rp)",
                promoPrice: "Promo Price (Rp)",
                pkgSize: "Package Size",
                pkgUnit: "Unit",
                photos: "Product / Price Tag Photos (Max 5)",
                saveBtn: "Save to Cloud",
                detailTitle: "Survey Details",
                closeBtn: "Close",
                tapDetail: "Tap for details",
                noPhoto: "No Photo",
                deleteConfirm: "Are you sure to delete this item?",
                viewPhotos: "Product Photos"
            },
            id: {
                title: "Market Survey Collector",
                searchPlaceholder: "🔍 Cari merek, produk, lokasi, kategori...",
                export: "Export CSV",
                noData: "Belum ada data survei.",
                loading: "Memuat data...",
                connReady: "● Cloud Connected (Siap)",
                connWait: "● Memuat sistem...",
                formTitle: "Catat Data Survei",
                store: "Lokasi / Toko *",
                brand: "Merek Produk *",
                category: "Kategori",
                regPrice: "Harga Normal (Rp)",
                promoPrice: "Harga Promo (Rp)",
                pkgSize: "Ukuran Kemasan",
                pkgUnit: "Satuan",
                photos: "Foto Produk / Label Harga (Maks 5)",
                saveBtn: "Simpan ke Cloud",
                detailTitle: "Detail Survei",
                closeBtn: "Tutup",
                tapDetail: "Ketuk untuk detail",
                noPhoto: "Tanpa Foto",
                deleteConfirm: "Yakin ingin menghapus item ini?",
                viewPhotos: "Foto Produk"
            }
        };

        window.changeLanguage = function(lang) {
            window.currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.getElementById('lang-select').value = lang;
            updateUIText();
            renderItems();
        };

        function updateUIText() {
            const t = i18n[window.currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('search-box').placeholder = t.searchPlaceholder;
            document.getElementById('btn-export').innerText = t.export;
            document.getElementById('form-modal-title').innerText = t.formTitle;
            document.getElementById('lbl-store').innerText = t.store;
            document.getElementById('lbl-brand').innerText = t.brand;
            document.getElementById('lbl-category').innerText = t.category;
            document.getElementById('lbl-regprice').innerText = t.regPrice;
            document.getElementById('lbl-promoprice').innerText = t.promoPrice;
            document.getElementById('lbl-pkgsize').innerText = t.pkgSize;
            document.getElementById('lbl-pkgunit').innerText = t.pkgUnit;
            document.getElementById('lbl-photos').innerText = t.photos;
            document.getElementById('btn-save').innerText = t.saveBtn;
            document.getElementById('detail-modal-title').innerText = t.detailTitle;
            document.getElementById('btn-close').innerText = t.closeBtn;
        }

        window.formatPriceInput = function(input) {
            let val = input.value.replace(/\D/g, "");
            if (val !== "") {
                val = Number(val).toLocaleString('id-ID');
            }
            input.value = val;
        };

        function parsePrice(str) {
            if (!str) return 0;
            return parseFloat(str.toString().replace(/\./g, '').replace(/,/g, '')) || 0;
        }

        window.openSettings = function() {
            const config = JSON.parse(localStorage.getItem('fb_config') || '{}');
            document.getElementById('cfg-apiKey').value = config.apiKey || 'AIzaSyDBH18QRTobEg-G4iIVJPAMpcBVhkKeidY';
            document.getElementById('cfg-authDomain').value = config.authDomain || 'market-survey-app-ad41c.firebaseapp.com';
            document.getElementById('cfg-projectId').value = config.projectId || 'market-survey-app-ad41c';
            document.getElementById('cfg-appId').value = config.appId || '1:313606973590:web:6dd2d6682a01799d30fab7';
            document.getElementById('settings-modal').classList.remove('hidden');
        };

        window.closeSettings = function() {
            document.getElementById('settings-modal').classList.add('hidden');
        };

        window.saveSettings = function() {
            const config = {
                apiKey: document.getElementById('cfg-apiKey').value.trim(),
                authDomain: document.getElementById('cfg-authDomain').value.trim(),
                projectId: document.getElementById('cfg-projectId').value.trim(),
                appId: document.getElementById('cfg-appId').value.trim()
            };
            localStorage.setItem('fb_config', JSON.stringify(config));
            window.closeSettings();
            location.reload();
        };

        window.openForm = function() {
            document.getElementById('survey-modal').classList.remove('hidden');
            document.getElementById('survey-form').reset();
            document.getElementById('categoryCustom').classList.add('hidden');
            document.getElementById('packageUnitCustom').classList.add('hidden');
            document.getElementById('photo-preview-grid').classList.add('hidden');
            document.getElementById('photo-preview-grid').innerHTML = '';
            window.currentPhotos = [];
        };

        window.closeForm = function() {
            document.getElementById('survey-modal').classList.add('hidden');
        };

        function getItemPhotos(item) {
            if (item.photos && Array.isArray(item.photos) && item.photos.length > 0) return item.photos;
            if (item.photo) return [item.photo];
            return [];
        }

        window.openDetail = function(id) {
            const item = window.surveyItems.find(i => i.id === id);
            if (!item) return;
            const t = i18n[window.currentLang];

            const unitText = item.packageSize ? `${item.packageSize} ${item.packageUnit || ''}` : '-';
            const regPrice = item.regularPrice ? `Rp ${Number(parsePrice(item.regularPrice)).toLocaleString('id-ID')}` : '-';
            const promoPrice = item.promoPrice ? `Rp ${Number(parsePrice(item.promoPrice)).toLocaleString('id-ID')}` : '-';
            
            const photos = getItemPhotos(item);
            let photosHtml = `<div class="text-xs text-slate-400">${t.noPhoto}</div>`;
            if (photos.length > 0) {
                photosHtml = `<div class="grid grid-cols-2 gap-2">${photos.map(p => `<img src="${p}" class="w-full h-32 object-cover rounded-lg border">`).join('')}</div>`;
            }

            document.getElementById('detail-content').innerHTML = `
                <div class="space-y-2">
                    <p><strong>Store:</strong> ${item.storeName}</p>
                    <p><strong>Brand:</strong> ${item.brand}</p>
                    <p><strong>Category:</strong> ${item.category || '-'}</p>
                    <p><strong>Regular Price:</strong> ${regPrice}</p>
                    <p><strong>Promo Price:</strong> ${promoPrice}</p>
                    <p><strong>Package Size:</strong> ${unitText}</p>
                    <p><strong>Date:</strong> ${new Date(item.timestamp).toLocaleString()}</p>
                    <div><strong>${t.viewPhotos} (${photos.length}):</strong></div>
                    ${photosHtml}
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        };

        window.closeDetail = function() {
            document.getElementById('detail-modal').classList.add('hidden');
        };

        window.handleCategoryChange = function() {
            const select = document.getElementById('categorySelect');
            const customInput = document.getElementById('categoryCustom');
            if (select.value === 'custom') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                customInput.value = '';
            }
        };

        window.handleUnitChange = function() {
            const select = document.getElementById('packageUnitSelect');
            const customInput = document.getElementById('packageUnitCustom');
            if (select.value === 'custom') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                customInput.value = '';
            }
            window.calculateUnit();
        };

        window.calculateUnit = function() {
            const reg = parsePrice(document.getElementById('regularPriceInput').value);
            const promo = parsePrice(document.getElementById('promoPriceInput').value);
            const size = parseFloat(document.getElementById('packageSize').value) || 0;
            
            const selectVal = document.getElementById('packageUnitSelect').value;
            const unit = selectVal === 'custom' ? document.getElementById('packageUnitCustom').value : selectVal;

            let finalPrice = promo > 0 ? promo : reg;
            let discount = (reg > 0 && promo > 0 && promo < reg) ? Math.round(((reg - promo) / reg) * 100) : 0;

            document.getElementById('calc-discount').innerText = `Discount: ${discount}%`;

            if (finalPrice > 0 && size > 0) {
                let unitPrice = finalPrice / size;
                document.getElementById('calc-unitprice').innerText = `Avg: Rp ${Math.round(unitPrice).toLocaleString('id-ID')} / ${unit || 'unit'}`;
            } else {
                document.getElementById('calc-unitprice').innerText = `Avg: -`;
            }
        };

        window.previewImages = function(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;
            if (window.currentPhotos.length + files.length > 5) {
                alert("Maximum 5 photos allowed.");
                return;
            }

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 600;
                        const MAX_HEIGHT = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        window.currentPhotos.push(canvas.toDataURL('image/jpeg', 0.7));
                        renderPhotoPreviews();
                    }
                }
                reader.readAsDataURL(file);
            });
        };

        function renderPhotoPreviews() {
            const container = document.getElementById('photo-preview-grid');
            if (window.currentPhotos.length > 0) {
                container.classList.remove('hidden');
                container.innerHTML = window.currentPhotos.map((photo, index) => `
                    <div class="relative w-full h-16 border rounded-lg overflow-hidden bg-slate-100">
                        <img src="${photo}" class="w-full h-full object-cover">
                        <button type="button" onclick="removePhoto(${index})" class="absolute top-0 right-0 bg-red-600 text-white w-5 h-5 flex items-center justify-center text-xs font-bold rounded-bl">×</button>
                    </div>
                `).join('');
            } else {
                container.classList.add('hidden');
                container.innerHTML = '';
            }
        }

        window.removePhoto = function(index) {
            window.currentPhotos.splice(index, 1);
            renderPhotoPreviews();
        };

        window.renderItems = function() {
            const keyword = document.getElementById('search-box').value.toLowerCase();
            const listEl = document.getElementById('survey-list');
            const items = window.surveyItems || [];
            const t = i18n[window.currentLang];

            const filtered = items.filter(i => 
                (i.storeName && i.storeName.toLowerCase().includes(keyword)) ||
                (i.brand && i.brand.toLowerCase().includes(keyword)) ||
                (i.category && i.category.toLowerCase().includes(keyword))
            );

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-400 bg-white rounded-xl border border-slate-200">${t.noData}</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => {
                const rawPrice = item.promoPrice ? item.promoPrice : item.regularPrice;
                const priceFormatted = rawPrice ? `Rp ${parsePrice(rawPrice).toLocaleString('id-ID')}` : '-';
                const rawReg = item.regularPrice && item.promoPrice ? `Rp ${parsePrice(item.regularPrice).toLocaleString('id-ID')}` : '';

                const photos = getItemPhotos(item);
                const thumbImg = photos.length > 0 ? photos[0] : '';
                const photoCount = photos.length;

                return `
                    <div onclick="openDetail('${item.id}')" class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex gap-3 items-center cursor-pointer hover:border-blue-400 transition">
                        <div class="w-20 h-20 bg-slate-100 rounded-lg flex-shrink-0 overflow-hidden border relative">
                            ${thumbImg ? `<img src="${thumbImg}" class="w-full h-full object-cover">` : `<div class="flex items-center justify-center h-full text-xs text-slate-400">${t.noPhoto}</div>`}
                            ${photoCount > 1 ? `<span class="absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-1 rounded">📷 ${photoCount}</span>` : ''}
                        </div>
                        <div class="flex-grow min-w-0">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-slate-800 truncate">${item.brand}</h3>
                                <button type="button" onclick="event.stopPropagation(); deleteItemFromCloud('${item.id}')" class="text-slate-300 hover:text-red-500 text-xs px-1">🗑️</button>
                            </div>
                            <p class="text-xs text-slate-500 truncate">📍 ${item.storeName} | ${item.category || '-'}</p>
                            <div class="mt-1 flex items-baseline justify-between">
                                <div class="flex items-baseline gap-2">
                                    <span class="font-bold text-blue-600 text-sm">${priceFormatted}</span>
                                    ${rawReg ? `<span class="text-xs text-slate-400 line-through">${rawReg}</span>` : ''}
                                </div>
                                <span class="text-[11px] text-blue-600 font-medium bg-blue-50 px-2 py-0.5 rounded">${t.tapDetail}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.exportCSV = function() {
            const items = window.surveyItems || [];
            if (items.length === 0) {
                alert("No data to export");
                return;
            }
            let csvContent = "\uFEFFStore,Brand,Category,Regular Price (Rp),Promo Price (Rp),Package Size,Unit,Photos Count,Timestamp\n";
            items.forEach(i => {
                const photos = getItemPhotos(i);
                csvContent += `"${i.storeName}","${i.brand}","${i.category || ''}","${i.regularPrice || ''}","${i.promoPrice || ''}","${i.packageSize || ''}","${i.packageUnit || ''}","${photos.length}","${i.timestamp}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `market-survey-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        };

        function initFirebase() {
            const config = JSON.parse(localStorage.getItem('fb_config') || '{}');
            if (config.apiKey && config.projectId) {
                try {
                    const app = initializeApp(config);
                    db = getFirestore(app);
                    document.getElementById('conn-status').innerText = i18n[window.currentLang].connReady;
                    document.getElementById('conn-status').className = "text-xs text-emerald-200";
                    loadCloudData();
                } catch (e) {
                    document.getElementById('conn-status').innerText = "● Connection Failed";
                    document.getElementById('conn-status').className = "text-xs text-red-200";
                }
            } else {
                document.getElementById('conn-status').innerText = "● ยังไม่ได้ตั้งค่า Firebase (คลิก ⚙️)";
                document.getElementById('conn-status').className = "text-xs text-amber-200";
            }
        }

        function loadCloudData() {
            if (!db) return;
            if (unsubscribe) unsubscribe();
            
            const q = collection(db, "surveys");
            unsubscribe = onSnapshot(q, (snapshot) => {
                window.surveyItems = [];
                snapshot.forEach((docSnap) => {
                    window.surveyItems.push({ id: docSnap.id, ...docSnap.data() });
                });
                window.renderItems();
            }, (error) => {
                document.getElementById('conn-status').innerText = "● Sync Error";
            });
        }

        window.saveItem = async function(event) {
            event.preventDefault();
            if (!db) {
                alert("Please configure Firebase first (⚙️)");
                window.openSettings();
                return;
            }

            const catSelect = document.getElementById('categorySelect').value;
            const finalCategory = catSelect === 'custom' ? document.getElementById('categoryCustom').value.trim() : catSelect;

            const unitSelect = document.getElementById('packageUnitSelect').value;
            const finalUnit = unitSelect === 'custom' ? document.getElementById('packageUnitCustom').value.trim() : unitSelect;

            const item = {
                storeName: document.getElementById('storeName').value,
                brand: document.getElementById('brand').value,
                category: finalCategory,
                regularPrice: document.getElementById('regularPriceInput').value,
                promoPrice: document.getElementById('promoPriceInput').value,
                packageSize: document.getElementById('packageSize').value,
                packageUnit: finalUnit,
                photos: window.currentPhotos || [],
                timestamp: new Date().toISOString()
            };
            try {
                await addDoc(collection(db, "surveys"), item);
                window.closeForm();
                document.getElementById('survey-form').reset();
                window.currentPhotos = [];
            } catch (e) {
                alert("Error saving: " + e.message);
            }
        };

        window.deleteItemFromCloud = async function(id) {
            const t = i18n[window.currentLang];
            if (!db || !confirm(t.deleteConfirm)) return;
            try {
                await deleteDoc(doc(db, "surveys", id));
            } catch (e) {
                alert("Cannot delete: " + e.message);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lang-select').value = window.currentLang;
            updateUIText();
            initFirebase();
        });
    </script>
</body>
</html>
