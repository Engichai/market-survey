<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Survey Collector (Cloud Real-Time)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-24">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg">Market Survey Collector</h1>
                <p id="conn-status" class="text-xs text-red-200">● กำลังเชื่อมต่อ Cloud...</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportCSV()" class="bg-blue-700 hover:bg-blue-800 text-xs px-2.5 py-1.5 rounded font-medium transition">Export CSV</button>
                <button onclick="openSettings()" class="bg-blue-700 hover:bg-blue-800 p-2 rounded-full transition">⚙️</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Filter Bar -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex gap-2">
            <input type="text" id="search-box" placeholder="🔍 ค้นหาแบรนด์, สินค้า, สถานที่..." class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="renderItems()">
        </div>

        <!-- Survey List -->
        <div id="survey-list" class="space-y-3">
            <!-- Items will be injected here -->
        </div>

    </main>

    <!-- Floating Action Button -->
    <div class="fixed bottom-6 right-6 z-40">
        <button onclick="openForm()" class="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl transition transform active:scale-95">+</button>
    </div>

    <!-- Modal Form -->
    <div id="survey-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 id="modal-title" class="font-bold text-lg text-slate-800">บันทึกข้อมูลสินค้าสำรวจ</h2>
                <button onclick="closeForm()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            </div>

            <form id="survey-form" onsubmit="saveItem(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">สถานที่สำรวจ (Store / Location) *</label>
                    <input type="text" id="storeName" required placeholder="เช่น Lotus Pluit, Supermarket A" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">แบรนด์สินค้า *</label>
                        <input type="text" id="brand" required placeholder="ชื่อแบรนด์" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">ประเภท / รสชาติ</label>
                        <input type="text" id="category" placeholder="เช่น ช็อกโกแลต, สูตรดั้งเดิม" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">ราคาปกติ</label>
                        <input type="number" id="regularPrice" step="any" placeholder="0.00" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="calculateUnit()">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">ราคาโปรโมชั่น</label>
                        <input type="number" id="promoPrice" step="any" placeholder="0.00" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="calculateUnit()">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">ขนาดบรรจุ</label>
                        <input type="number" id="packageSize" step="any" placeholder="เช่น 150 หรือ 12" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" oninput="calculateUnit()">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">หน่วย</label>
                        <select id="packageUnit" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500" onchange="calculateUnit()">
                            <option value="กรัม">กรัม (g)</option>
                            <option value="มิลลิลิตร">มิลลิลิตร (ml)</option>
                            <option value="ชิ้น">ชิ้น (pcs)</option>
                            <option value="แพ็ค">แพ็ค</option>
                        </select>
                    </div>
                </div>

                <div class="bg-blue-50 p-2.5 rounded-lg text-xs text-blue-800 flex justify-between">
                    <span id="calc-discount">ส่วนลด: 0%</span>
                    <span id="calc-unitprice" class="font-bold">ราคาเฉลี่ย: -</span>
                </div>

                <div>
                    <label class="block font-medium text-slate-700 mb-1">รูปถ่ายสินค้า / ป้ายราคา</label>
                    <input type="file" id="itemPhoto" accept="image/*" capture="environment" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" onchange="previewImage(event)">
                    <div id="photo-preview-container" class="mt-2 hidden">
                        <img id="photo-preview" class="w-full h-32 object-cover rounded-lg border">
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">บันทึกข้อมูลเข้า Cloud</button>
            </form>
        </div>
    </div>

    <!-- Modal Settings -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="font-bold text-lg text-slate-800">ตั้งค่า Firebase Cloud</h2>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            </div>
            <p class="text-xs text-slate-500">นำข้อมูล Firebase Config ของคุณมาใส่ที่นี่เพื่อให้ทีมงานเชื่อมต่อฐานข้อมูลกลางร่วมกันได้ทันที</p>
            <div class="space-y-2 text-xs">
                <div>
                    <label class="font-medium">API Key</label>
                    <input type="text" id="cfg-apiKey" class="w-full border rounded p-1.5 mt-0.5">
                </div>
                <div>
                    <label class="font-medium">Auth Domain</label>
                    <input type="text" id="cfg-authDomain" class="w-full border rounded p-1.5 mt-0.5">
                </div>
                <div>
                    <label class="font-medium">Project ID</label>
                    <input type="text" id="cfg-projectId" class="w-full border rounded p-1.5 mt-0.5">
                </div>
                <div>
                    <label class="font-medium">App ID</label>
                    <input type="text" id="cfg-appId" class="w-full border rounded p-1.5 mt-0.5">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="saveSettings()" class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg text-sm">บันทึก & เชื่อมต่อ</button>
                <button onclick="closeSettings()" class="w-full bg-slate-200 text-slate-700 font-medium py-2 rounded-lg text-sm">ปิด</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let db = null;
        let unsubscribe = null;
        window.surveyItems = [];
        let currentPhotoBase64 = "";

        window.initFirebaseFromStorage = function() {
            const config = JSON.parse(localStorage.getItem('fb_config') || '{}');
            if (config.apiKey && config.projectId) {
                try {
                    const app = initializeApp(config);
                    db = getFirestore(app);
                    document.getElementById('conn-status').innerText = "● Cloud Connected (พร้อมใช้งาน)";
                    document.getElementById('conn-status').className = "text-xs text-emerald-200";
                    loadCloudData();
                } catch (e) {
                    document.getElementById('conn-status').innerText = "● Connection Failed";
                    document.getElementById('conn-status').className = "text-xs text-red-200";
                }
            } else {
                document.getElementById('conn-status').innerText = "● ยังไม่ได้ตั้งค่า Firebase (คลิก ⚙️)";
                document.getElementById('conn-status').className = "text-xs text-amber-200";
            }
        }

        function loadCloudData() {
            if (!db) return;
            if (unsubscribe) unsubscribe();
            
            const q = collection(db, "surveys");
            unsubscribe = onSnapshot(q, (snapshot) => {
                window.surveyItems = [];
                snapshot.forEach((docSnap) => {
                    window.surveyItems.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderItems();
            }, (error) => {
                document.getElementById('conn-status').innerText = "● Sync Error (ตรวจสอบสิทธิ์ Test Mode)";
            });
        }

        window.save
