<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Survey Collector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#F8F9FA] text-slate-800 antialiased pb-28">

    <!-- Header / Top Bar -->
    <header class="bg-white sticky top-0 z-40 border-b border-slate-100 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button type="button" onclick="openCategoryModal()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-700 transition cursor-pointer shadow-sm">
                    📁
                </button>
                <div>
                    <h1 id="ui-title" class="font-bold text-base text-slate-900 leading-tight">Market Survey</h1>
                    <p id="conn-status" class="text-[10px] text-amber-600 font-medium">● Connecting...</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-100 text-slate-700 text-xs px-2 py-1.5 rounded-full font-semibold outline-none cursor-pointer border border-slate-200">
                    <option value="th">🇹🇭 TH</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="id">🇮🇩 ID</option>
                </select>
                <button type="button" onclick="openSettings()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-700 transition cursor-pointer shadow-sm">
                    ⚙️
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Search & Filter Bar -->
        <div class="flex gap-2 items-center">
            <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">🔍</span>
                <input type="text" id="search-box" placeholder="Search product, store..." class="w-full bg-white text-sm text-slate-800 placeholder-slate-400 border border-slate-200 rounded-2xl pl-10 pr-4 py-3 outline-none focus:border-amber-400 shadow-sm transition" oninput="renderItems()">
            </div>
            <button type="button" onclick="exportCSV()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 px-4 py-3 rounded-2xl font-semibold text-xs transition shadow-sm flex-shrink-0">
                Export
            </button>
        </div>

        <!-- Pill Category Tabs (Mock / Quick Filter) -->
        <div id="quick-category-tabs" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
            <!-- Dynamic Category Pills -->
        </div>

        <!-- Survey List Grid (2 Columns Style) -->
        <div id="survey-list" class="grid grid-cols-2 gap-3">
            <div id="ui-loading" class="col-span-2 text-center py-12 text-slate-400 bg-white rounded-3xl border border-slate-100 shadow-sm">Loading...</div>
        </div>

    </main>

    <!-- Bottom Navigation Bar (Modern App Style) -->
    <nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-100 z-30 max-w-md mx-auto px-6 py-2.5 flex justify-between items-center shadow-lg">
        <button onclick="filterByCategory(null)" class="flex flex-col items-center text-amber-500 gap-0.5">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold">Home</span>
        </button>
        <button onclick="openCategoryModal()" class="flex flex-col items-center text-slate-400 hover:text-slate-600 gap-0.5">
            <span class="text-xl">📁</span>
            <span class="text-[10px] font-medium" id="nav-cat">Category</span>
        </button>
        <!-- Center Floating Action Button -->
        <div class="relative -top-5">
            <button type="button" onclick="openForm()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 w-14 h-14 rounded-full shadow-xl shadow-amber-400/30 flex items-center justify-center text-3xl font-light transition transform active:scale-90">
                +
            </button>
        </div>
        <button onclick="exportCSV()" class="flex flex-col items-center text-slate-400 hover:text-slate-600 gap-0.5">
            <span class="text-xl">📊</span>
            <span class="text-[10px] font-medium">Export</span>
        </button>
        <button onclick="openSettings()" class="flex flex-col items-center text-slate-400 hover:text-slate-600 gap-0.5">
            <span class="text-xl">⚙️</span>
            <span class="text-[10px] font-medium">Settings</span>
        </button>
    </nav>

    <!-- Modal Form (Add / Edit) -->
    <div id="survey-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h2 id="form-modal-title" class="font-bold text-lg text-slate-900">New Survey Item</h2>
                <button type="button" onclick="closeForm()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-500 font-bold">✕</button>
            </div>

            <form id="survey-form" onsubmit="saveItem(event)" class="space-y-3.5 text-sm">
                <div>
                    <label id="lbl-store" class="block font-semibold text-slate-700 mb-1 text-xs uppercase tracking-wider">Store / Location *</label>
                    <input type="text" id="storeName" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 transition">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label id="lbl-brand" class="block font-semibold text-slate-700 mb-1 text-xs uppercase tracking-wider">Brand *</label>
                        <input type="text" id="brand" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 transition">
                    </div>
                    <div>
                        <label id="lbl-productname" class="block font-semibold text-slate-700 mb-1 text-xs uppercase tracking-wider">Product Name *</label>
                        <input type="text" id="productName" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 transition">
                    </div>
                </div>

                <div>
                    <label id="lbl-category" class="block font-semibold text-slate-700 mb-1 text-xs uppercase tracking-wider">Category</label>
                    <select id="categorySelect" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 mb-2 transition" onchange="handleCategoryChange()">
                        <option value="อาหาร">🍽️ อาหาร (Food)</option>
                        <option value="เครื่องดื่ม">🥤 เครื่องดื่ม (Beverage)</option>
                        <option value="อุปกรณ์ไฟฟ้า">⚡ อุปกรณ์ไฟฟ้า (Electronics)</option>
                        <option value="ห้องครัว">🍳 ห้องครัว (Kitchen)</option>
                        <option value="custom">-- ✍️ ระบุเอง (Other) --</option>
                    </select>
                    <input type="text" id="categoryCustom" placeholder="Enter category..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 hidden transition">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label id="lbl-regprice" class="block font-semibold text-slate-700 mb-1 text-xs uppercase tracking-wider">Regular Price (Rp)</label>
                        <input type="text" id="regularPriceInput" placeholder="50,000" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 transition" oninput="formatPriceInput(this); calculateUnit();">
                    </div>
                    <div>
                        <label id="lbl-promoprice" class="block font-semibold text-slate-700 mb-1 text-xs uppercase tracking-wider">Promo Price (Rp)</label>
                        <input type="text" id="promoPriceInput" placeholder="45,000" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 transition" oninput="formatPriceInput(this); calculateUnit();">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label id="lbl-pkgsize" class="block font-semibold text-slate-700 mb-1 text-xs uppercase tracking-wider">Package Size</label>
                        <input type="number" id="packageSize" step="any" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 transition" oninput="calculateUnit()">
                    </div>
                    <div>
                        <label id="lbl-pkgunit" class="block font-semibold text-slate-700 mb-1 text-xs uppercase tracking-wider">Unit</label>
                        <select id="packageUnitSelect" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 mb-2 transition" onchange="handleUnitChange()">
                            <option value="กรัม">กรัม (g)</option>
                            <option value="มิลลิลิตร">มิลลิลิตร (ml)</option>
                            <option value="ชิ้น">ชิ้น (pcs)</option>
                            <option value="แพ็ค">แพ็ค</option>
                            <option value="custom">-- พิมพ์ระบุเอง --</option>
                        </select>
                        <input type="text" id="packageUnitCustom" placeholder="Enter unit..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 hidden transition">
                    </div>
                </div>

                <div class="bg-amber-50 p-3 rounded-2xl text-xs text-amber-900 flex justify-between font-medium">
                    <span id="calc-discount">Discount: 0%</span>
                    <span id="calc-unitprice" class="font-bold">Avg: -</span>
                </div>

                <div>
                    <label id="lbl-note" class="block font-semibold text-slate-700 mb-1 text-xs uppercase tracking-wider">Note / Remarks</label>
                    <textarea id="itemNote" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 outline-none focus:border-amber-400 transition"></textarea>
                </div>

                <div>
                    <label id="lbl-photos" class="block font-semibold text-slate-700 mb-1 text-xs uppercase tracking-wider">Photos (Max 5)</label>
                    <input type="file" id="itemPhoto" accept="image/*" multiple class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100" onchange="previewImages(event)">
                    <div id="photo-preview-grid" class="mt-2 grid grid-cols-5 gap-2 hidden"></div>
                </div>

                <button type="submit" id="btn-save" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold py-3.5 rounded-2xl transition shadow-lg shadow-amber-400/20">Save to Cloud</button>
            </form>
        </div>
    </div>

    <!-- Modal Category List -->
    <div id="category-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h2 id="cat-modal-title" class="font-bold text-lg text-slate-900">All Categories</h2>
                <button type="button" onclick="closeCategoryModal()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-500 font-bold">✕</button>
            </div>
            <div id="category-list-container" class="space-y-2"></div>
            <button type="button" onclick="closeCategoryModal()" id="btn-close-cat" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-2xl text-sm transition">Close</button>
        </div>
    </div>

    <!-- Modal Detail -->
    <div id="detail-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h2 id="detail-modal-title" class="font-bold text-lg text-slate-900">Survey Details</h2>
                <button type="button" onclick="closeDetail()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-500 font-bold">✕</button>
            </div>
            <div id="detail-content" class="space-y-2.5 text-sm text-slate-700"></div>
            <button type="button" onclick="closeDetail()" id="btn-close" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-2xl text-sm transition">Close</button>
        </div>
    </div>

    <!-- Modal Settings -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h2 class="font-bold text-lg text-slate-900">Firebase Config</h2>
                <button type="button" onclick="closeSettings()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-500 font-bold">✕</button>
            </div>
            <p class="text-xs text-slate-500">Configure your Firestore credentials here.</p>
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="font-semibold text-slate-700">API Key</label>
                    <input type="text" id="cfg-apiKey" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 mt-1 outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="font-semibold text-slate-700">Auth Domain</label>
                    <input type="text" id="cfg-authDomain" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 mt-1 outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="font-semibold text-slate-700">Project ID</label>
                    <input type="text" id="cfg-projectId" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 mt-1 outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="font-semibold text-slate-700">App ID</label>
                    <input type="text" id="cfg-appId" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 mt-1 outline-none focus:border-amber-400">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="saveSettings()" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold py-3 rounded-2xl text-sm transition">Save & Connect</button>
                <button type="button" onclick="closeSettings()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-2xl text-sm transition">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let db = null;
        let unsubscribe = null;
        window.surveyItems = [];
        window.currentPhotos = [];

        window.selectedCategoryFilter = null;

        const i18n = {

        window.changeLanguage = function(lang) {
            window.currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.getElementById('lang-select').value = lang;
            updateUIText();
            renderItems();
            renderQuickTabs();
        };

        function updateUIText() {
            const t = i18n[window.currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('nav-cat').innerText = t.catMenu;
            document.getElementById('search-box').placeholder = t.searchPlaceholder;
            document.getElementById('form-modal-title').innerText = t.formTitle;
            document.getElementById('lbl-store').innerText = t.store;
            document.getElementById('lbl-brand').innerText = t.brand;
            document.getElementById('lbl-productname').innerText = t.productName;
            document.getElementById('lbl-category').innerText = t.category;
            document.getElementById('lbl-regprice').innerText = t.regPrice;
            document.getElementById('lbl-promoprice').innerText = t.promoPrice;
            document.getElementById('lbl-pkgsize').innerText = t.pkgSize;
            document.getElementById('lbl-pkgunit').innerText = t.pkgUnit;
            document.getElementById('lbl-note').innerText = t.note;
            document.getElementById('lbl-photos').innerText = t.photos;
            document.getElementById('btn-save').innerText = t.saveBtn;
            document.getElementById('detail-modal-title').innerText = t.detailTitle;
            document.getElementById('btn-close').innerText = t.closeBtn;
            document.getElementById('cat-modal-title').innerText = t.catModalTitle;
            document.getElementById('btn-close-cat').innerText = t.closeBtn;

            document.getElementById('storeName').placeholder = t.storePlaceholder;
            document.getElementById('brand').placeholder = t.brandPlaceholder;
            document.getElementById('productName').placeholder = t.productPlaceholder;
            document.getElementById('packageSize').placeholder = t.pkgSizePlaceholder;
            document.getElementById('itemNote').placeholder = t.notePlaceholder;
            document.getElementById('categoryCustom').placeholder = t.customCatPlaceholder;
            document.getElementById('packageUnitCustom').placeholder = t.customUnitPlaceholder;
        }

        window.formatPriceInput = function(input) {
            let val = input.value.replace(/\D/g, "");
            if (val !== "") val = Number(val).toLocaleString('id-ID');
            input.value = val;
        };

        function parsePrice(str) {
            if (!str) return 0;
            return parseFloat(str.toString().replace(/\./g, '').replace(/,/g, '')) || 0;
        }

        window.openSettings = function() {
            const config = JSON.parse(localStorage.getItem('fb_config') || '{}');
            document.getElementById('cfg-apiKey').value = config.apiKey || 'AIzaSyDBH18QRTobEg-G4iIVJPAMpcBVhkKeidY';
            document.getElementById('cfg-authDomain').value = config.authDomain || 'market-survey-app-ad41c.firebaseapp.com';
            document.getElementById('cfg-projectId').value = config.projectId || 'market-survey-app-ad41c';
            document.getElementById('cfg-appId').value = config.appId || '1:313606973590:web:6dd2d6682a01799d30fab7';
            document.getElementById('settings-modal').classList.remove('hidden');
        };

        window.closeSettings = function() { document.getElementById('settings-modal').classList.add('hidden'); };

        window.saveSettings = function() {
            const config = {
                apiKey: document.getElementById('cfg-apiKey').value.trim(),
                authDomain: document.getElementById('cfg-authDomain').value.trim(),
                projectId: document.getElementById('cfg-projectId').value.trim(),
                appId: document.getElementById('cfg-appId').value.trim()
            };
            localStorage.setItem('fb_config', JSON.stringify(config));
            window.closeSettings();
            location.reload();
        };

        window.openForm = function() {
            document.getElementById('survey-modal').classList.remove('hidden');
            document.getElementById('survey-form').reset();
            document.getElementById('categoryCustom').classList.add('hidden');
            document.getElementById('packageUnitCustom').classList.add('hidden');
            document.getElementById('photo-preview-grid').classList.add('hidden');
            document.getElementById('photo-preview-grid').innerHTML = '';
            window.currentPhotos = [];
        };

        window.closeForm = function() { document.getElementById('survey-modal').classList.add('hidden'); };

        window.openCategoryModal = function() {
            const t = i18n[window.currentLang];
            const container = document.getElementById('category-list-container');
            const items = window.surveyItems || [];
            const catMap = {};
            items.forEach(i => {
                const cat = i.category || 'Uncategorized';
                catMap[cat] = (catMap[cat] || 0) + 1;
            });

            let html = `
                <div onclick="filterByCategory(null)" class="p-3.5 bg-amber-50 border border-amber-200 rounded-2xl cursor-pointer hover:bg-amber-100 flex justify-between items-center font-semibold text-amber-900 transition">
                    <span>${t.allCategories}</span>
                    <span class="text-xs bg-amber-200 px-2.5 py-1 rounded-full">${items.length} ${t.itemsCount}</span>
                </div>
            `;

            Object.keys(catMap).sort().forEach(cat => {
                const isSelected = window.selectedCategoryFilter === cat;
                html += `
                    <div onclick="filterByCategory('${cat}')" class="p-3.5 bg-slate-50 border ${isSelected ? 'border-amber-400 bg-amber-50/50' : 'border-slate-100'} rounded-2xl cursor-pointer hover:border-amber-300 flex justify-between items-center transition">
                        <span class="font-medium text-slate-700">📁 ${cat}</span>
                        <span class="text-xs bg-slate-200 text-slate-600 px-2.5 py-1 rounded-full">${catMap[cat]} ${t.itemsCount}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('category-modal').classList.remove('hidden');
        };

        window.closeCategoryModal = function() { document.getElementById('category-modal').classList.add('hidden'); };

        window.filterByCategory = function(category) {
            window.selectedCategoryFilter = category;
            closeCategoryModal();
            renderItems();
            renderQuickTabs();
        };

        function renderQuickTabs() {
            const container = document.getElementById('quick-category-tabs');
            const items = window.surveyItems || [];
            const cats = [...new Set(items.map(i => i.category).filter(Boolean))].sort();

            let html = `
                <button onclick="filterByCategory(null)" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition ${window.selectedCategoryFilter === null ? 'bg-amber-400 text-slate-900 shadow-md shadow-amber-400/20' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                    All Items
                </button>
            `;
            cats.forEach(cat => {
                const isSel = window.selectedCategoryFilter === cat;
                html += `
                    <button onclick="filterByCategory('${cat}')" class="px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition ${isSel ? 'bg-amber-400 text-slate-900 shadow-md shadow-amber-400/20' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                        ${cat}
                    </button>
                `;
            });
            container.innerHTML = html;
        }

        function getItemPhotos(item) {
            if (item.photos && Array.isArray(item.photos) && item.photos.length > 0) return item.photos;
            if (item.photo) return [item.photo];
            return [];
        }

        window.openDetail = function(id) {
            const item = window.surveyItems.find(i => i.id === id);
            if (!item) return;
            const t = i18n[window.currentLang];

            const unitText = item.packageSize ? `${item.packageSize} ${item.packageUnit || ''}` : '-';
            const regPrice = item.regularPrice ? `Rp ${Number(parsePrice(item.regularPrice)).toLocaleString('id-ID')}` : '-';
            const promoPrice = item.promoPrice ? `Rp ${Number(parsePrice(item.promoPrice)).toLocaleString('id-ID')}` : '-';
            
            const photos = getItemPhotos(item);
            let photosHtml = `<div class="text-xs text-slate-400">${t.noPhoto}</div>`;
            if (photos.length > 0) {
                photosHtml = `<div class="grid grid-cols-2 gap-2">${photos.map(p => `<img src="${p}" class="w-full h-36 object-cover rounded-2xl border border-slate-100">`).join('')}</div>`;
            }

            document.getElementById('detail-content').innerHTML = `
                <div class="space-y-2">
                    <p><strong>Store:</strong> ${item.storeName}</p>
                    <p><strong>Brand:</strong> ${item.brand}</p>
                    <p><strong>Product Name:</strong> ${item.productName || item.brand}</p>
                    <p><strong>Category:</strong> ${item.category || '-'}</p>
                    <p><strong>Regular Price:</strong> ${regPrice}</p>
                    <p><strong>Promo Price:</strong> ${promoPrice}</p>
                    <p><strong>Package Size:</strong> ${unitText}</p>
                    <p><strong>Note:</strong> ${item.note || '-'}</p>
                    <p><strong>Date:</strong> ${new Date(item.timestamp).toLocaleString()}</p>
                    <div><strong>${t.viewPhotos} (${photos.length}):</strong></div>
                    ${photosHtml}
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        };

        window.closeDetail = function() { document.getElementById('detail-modal').classList.add('hidden'); };

        window.handleCategoryChange = function() {
            const select = document.getElementById('categorySelect');
            const customInput = document.getElementById('categoryCustom');
            if (select.value === 'custom') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                customInput.value = '';
            }
        };

        window.handleUnitChange = function() {
            const select = document.getElementById('packageUnitSelect');
            const customInput = document.getElementById('packageUnitCustom');
            if (select.value === 'custom') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
                customInput.value = '';
            }
            window.calculateUnit();
        };

        window.calculateUnit = function() {
            const reg = parsePrice(document.getElementById('regularPriceInput').value);
            const promo = parsePrice(document.getElementById('promoPriceInput').value);
            const size = parseFloat(document.getElementById('packageSize').value) || 0;
            const selectVal = document.getElementById('packageUnitSelect').value;
            const unit = selectVal === 'custom' ? document.getElementById('packageUnitCustom').value : selectVal;

            let finalPrice = promo > 0 ? promo : reg;
            let discount = (reg > 0 && promo > 0 && promo < reg) ? Math.round(((reg - promo) / reg) * 100) : 0;

            document.getElementById('calc-discount').innerText = `Discount: ${discount}%`;
            if (finalPrice > 0 && size > 0) {
                let unitPrice = finalPrice / size;
                document.getElementById('calc-unitprice').innerText = `Avg: Rp ${Math.round(unitPrice).toLocaleString('id-ID')} / ${unit || 'unit'}`;
            } else {
                document.getElementById('calc-unitprice').innerText = `Avg: -`;
            }
        };

        window.previewImages = function(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;
            if (window.currentPhotos.length + files.length > 5) {
                alert("Maximum 5 photos allowed.");
                return;
            }
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 600;
                        const MAX_HEIGHT = 600;
                        let width = img.width, height = img.height;
                        if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
                        else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        window.currentPhotos.push(canvas.toDataURL('image/jpeg', 0.7));
                        renderPhotoPreviews();
                    }
                }
                reader.readAsDataURL(file);
            });
        };

        function renderPhotoPreviews() {
            const container = document.getElementById('photo-preview-grid');
            if (window.currentPhotos.length > 0) {
                container.classList.remove('hidden');
                container.innerHTML = window.currentPhotos.map((photo, index) => `
                    <div class="relative w-full h-16 border border-slate-200 rounded-2xl overflow-hidden bg-slate-50">
                        <img src="${photo}" class="w-full h-full object-cover">
                        <button type="button" onclick="removePhoto(${index})" class="absolute top-0 right-0 bg-red-500 text-white w-5 h-5 flex items-center justify-center text-xs font-bold rounded-bl-xl">✕</button>
                    </div>
                `).join('');
            } else { container.classList.add('hidden'); container.innerHTML = ''; }
        }

        window.removePhoto = function(index) {
            window.currentPhotos.splice(index, 1);
            renderPhotoPreviews();
        };

        window.renderItems = function() {
            const keyword = document.getElementById('search-box').value.toLowerCase();
            const listEl = document.getElementById('survey-list');
            const items = window.surveyItems || [];
            const t = i18n[window.currentLang];

            let filtered = items.filter(i => {
                const matchKeyword = 
                    (i.storeName && i.storeName.toLowerCase().includes(keyword)) ||
                    (i.brand && i.brand.toLowerCase().includes(keyword)) ||
                    (i.productName && i.productName.toLowerCase().includes(keyword)) ||
                    (i.category && i.category.toLowerCase().includes(keyword));
                const matchCategory = window.selectedCategoryFilter ? (i.category === window.selectedCategoryFilter) : true;
                return matchKeyword && matchCategory;
            });

            filtered.sort((a, b) => {
                const nameA = (a.productName || a.brand || '').toLowerCase();
                const nameB = (b.productName || b.brand || '').toLowerCase();
                return nameA.localeCompare(nameB, 'th');
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-400 bg-white rounded-3xl border border-slate-100 shadow-sm">${t.noData}</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => {
                const rawPrice = item.promoPrice ? item.promoPrice : item.regularPrice;
                const priceFormatted = rawPrice ? `Rp ${parsePrice(rawPrice).toLocaleString('id-ID')}` : '-';
                const rawReg = item.regularPrice && item.promoPrice ? `Rp ${parsePrice(item.regularPrice).toLocaleString('id-ID')}` : '';

                const photos = getItemPhotos(item);
                const thumbImg = photos.length > 0 ? photos[0] : '';
                const displayName = item.productName || item.brand;

                return `
                    <div onclick="openDetail('${item.id}')" class="bg-white p-3 rounded-3xl shadow-sm border border-slate-100 hover:border-amber-300 transition flex flex-col justify-between cursor-pointer relative group">
                        <!-- Favorite Heart Icon Mock -->
                        <button type="button" onclick="event.stopPropagation(); deleteItemFromCloud('${item.id}')" class="absolute top-4 right-4 w-7 h-7 bg-white/80 backdrop-blur-sm rounded-full flex items-center justify-center text-slate-400 hover:text-red-500 shadow-sm z-10 transition">
                            🗑️
                        </button>

                        <div class="w-full h-32 bg-slate-50 rounded-2xl overflow-hidden relative mb-2.5">
                            ${thumbImg ? `<img src="${thumbImg}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">` : `<div class="flex items-center justify-center h-full text-xs text-slate-400">${t.noPhoto}</div>`}
                        </div>

                        <div class="space-y-1">
                            <span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full uppercase tracking-wider">${item.category || 'General'}</span>
                            <h3 class="font-bold text-slate-900 text-sm truncate">${displayName}</h3>
                            <p class="text-[11px] text-slate-400 truncate">📍 ${item.storeName}</p>
                            
                            <div class="pt-1 flex flex-col">
                                <span class="font-bold text-slate-900 text-sm">${priceFormatted}</span>
                                ${rawReg ? `<span class="text-[10px] text-slate-400 line-through">${rawReg}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.exportCSV = function() {
            const items = window.surveyItems || [];
            if (items.length === 0) { alert("No data"); return; }
            let csvContent = "\uFEFFStore,Brand,Product Name,Category,Regular Price (Rp),Promo Price (Rp),Package Size,Unit,Note,Photos Count,Timestamp\n";
            items.forEach(i => {
                const photos = getItemPhotos(i);
                csvContent += `"${i.storeName}","${i.brand}","${i.productName || ''}","${i.category || ''}","${i.regularPrice || ''}","${i.promoPrice || ''}","${i.packageSize || ''}","${i.packageUnit || ''}","${i.note || ''}","${photos.length}","${i.timestamp}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url;
            a.download = `market-survey-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        };

        function initFirebase() {
            const config = JSON.parse(localStorage.getItem('fb_config') || '{}');
            if (config.apiKey && config.projectId) {
                try {
                    const app = initializeApp(config);
                    db = getFirestore(app);
                    document.getElementById('conn-status').innerText = i18n[window.currentLang].connReady;
                    document.getElementById('conn-status').className = "text-[10px] text-emerald-600 font-medium";
                    loadCloudData();
                } catch (e) {
                    document.getElementById('conn-status').innerText = "● Error";
                }
            } else {
                document.getElementById('conn-status').innerText = "● Setup Required (⚙️)";
            }
        }

        function loadCloudData() {
            if (!db) return;
            if (unsubscribe) unsubscribe();
            const q = collection(db, "surveys");
            unsubscribe = onSnapshot(q, (snapshot) => {
                window.surveyItems = [];
                snapshot.forEach((docSnap) => {
                    window.surveyItems.push({ id: docSnap.id, ...docSnap.data() });
                });
                window.renderItems();
                renderQuickTabs();
            }, (error) => { document.getElementById('conn-status').innerText = "● Sync Error"; });
        }

        window.saveItem = async function(event) {
            event.preventDefault();
            if (!db) { alert("Please configure Firebase first (⚙️)"); window.openSettings(); return; }

            const catSelect = document.getElementById('categorySelect').value;
            const finalCategory = catSelect === 'custom' ? document.getElementById('categoryCustom').value.trim() : catSelect;
            const unitSelect = document.getElementById('packageUnitSelect').value;
            const finalUnit = unitSelect === 'custom' ? document.getElementById('packageUnitCustom').value.trim() : unitSelect;

            const item = {
                storeName: document.getElementById('storeName').value,
                brand: document.getElementById('brand').value,
                productName: document.getElementById('productName').value,
                category: finalCategory,
                regularPrice: document.getElementById('regularPriceInput').value,
                promoPrice: document.getElementById('promoPriceInput').value,
                packageSize: document.getElementById('packageSize').value,
                packageUnit: finalUnit,
                note: document.getElementById('itemNote').value,
                photos: window.currentPhotos || [],
                timestamp: new Date().toISOString()
            };
            try {
                await addDoc(collection(db, "surveys"), item);
                window.closeForm();
                document.getElementById('survey-form').reset();
                window.currentPhotos = [];
            } catch (e) { alert("Error: " + e.message); }
        };

        window.deleteItemFromCloud = async function(id) {
            const t = i18n[window.currentLang];
            if (!db || !confirm(t.deleteConfirm)) return;
            try { await deleteDoc(doc(db, "surveys", id)); } catch (e) { alert("Cannot delete"); }
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lang-select').value = window.currentLang;
            updateUIText();
            initFirebase();
        });
    </script>
</body>
</html>
